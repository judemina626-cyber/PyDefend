services:
  - type: web
    name: pydefend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --access-logfile - --error-logfile - app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYDEFEND_SECRET
        generateValue: true
